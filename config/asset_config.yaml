# Asset under study. Change these values to study another asset; nothing is hardcoded to AAPL.
symbol: AAPL
company_name: Apple
exchange_timezone: America/New_York   # also: UTC, Asia/Kolkata
bar_interval: 1d                      # 1m,5m,15m,30m,1h,1d
horizons: [1, 2, 3, 4, 5]             # n+h bars ahead (n+0 is a nowcast, reported separately)

# Live (Apify) collection
search_queries:
  - "$AAPL"
  - "Apple stock"
  - "Apple earnings"
  - "Apple shares"
exclude_keywords: []
lookback_days: 180

# Historical study window taken from the existing stock-tweet dataset
history:
  source: stock_tweets_csv
  start: "2015-01-01"
  end: "2019-12-31"
  ticker_in_dataset: AAPL
